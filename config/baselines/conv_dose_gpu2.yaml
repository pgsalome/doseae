dataset:
  dataset_type: patches
  data_h5:
    train: /data/pgsal/NSCLC-Cetuximab_AE_cache/processed_patches/train.h5
    val: /data/pgsal/NSCLC-Cetuximab_AE_cache/processed_patches/val.h5
    test: /data/pgsal/NSCLC-Cetuximab_AE_cache/processed_patches/test.h5
  input_channels:
  - dose
  num_workers: 16
  pin_memory: true
  is_2d: false
  slice_size_2d: 256
  patch_size_3d:
  - 50
  - 50
  - 50
  input_size_3d:
  - 50
  - 50
  - 50
  fusion:
    method: weighted_sum
    dose_weight: 0.7
    ct_weight: 0.3
    normalize: false
  min_dose: 1.0e-06
  use_single_file: false
  data_file: null
  test_mode: false
  n_test_samples: 20
preprocessing_config: ../new_pipeline_config.yaml
transforms:
  augment: false
  rotate: false
  flip: false
  adjust_brightness: false
  random_crop: false
  random_noise: false
model:
  type: conv_autoencoder
  latent_dim: 128
  base_filters: 32
  feature_dim: 256
  output_channels: 1
  input_mode: dose_only
  input_size:
  - 50
  - 50
  - 50
  use_bottleneck: false
  bilinear_upsampling: false
  dropout_mlp: 0.1
  dropout_decoder: 0.1
  dropout_features: 0.1
  projection_sizes:
  - 256
  - 128
  - 64
  - 32
  - 16
  - 8
  - 4
  attention:
    enabled: false
    type: multi_scale
    num_heads: 4
    embed_dim: 256
    dose_threshold: 0.5
  auxiliary:
    predict_high_dose: false
    high_dose_label_key: high_dose_labels
    predict_dose_level: false
    dose_level_label_key: dose_level_labels
    dropout: 0.3
training:
  optimizer: adam
  scheduler: reduce_on_plateau
  scheduler_patience: 2
  loss: mse
  batch_size: 32
  learning_rate: 0.0001
  epochs: 100
  early_stopping_patience: 10
  weight_decay: 0.00001
  beta: 1.0
  gpu_ids:
  - 2
  seed: 44
  grad_clip: 0.05
  non_zero_loss: false
  accumulation_steps: 1
  numexpr_max_threads: 32
  use_amp: false
  log_frequency: 10
  log_grad_norm: true
clinical_metrics: null
loss_function:
  type: mse
wandb:
  use_wandb: true
  project_name: dose_distribution_autoencoder_05mm
  entity: pgsalome
  name: conv_dose_gpu2
  group: gpu2_runs
  log_validation_sample: true
pretrained_encoder:
  use_pretrained_ct_encoder: true
  source: models_genesis
  ssl_variant: genesis
  ct_encoder_path: external/ModelsGenesis/pretrained/Genesis_Chest_CT.pt
  freeze_ct_encoder: false
optuna:
  use_optuna: false
  n_trials: 50
  timeout: 86400
  direction: minimize
  sampler: tpe
  pruner: median
  parameters:
  - name: model.latent_dim
    type: int
    low: 32
    high: 256
    log: true
  - name: model.base_filters
    type: int
    low: 16
    high: 64
    log: true
  - name: model.attention.type
    type: categorical
    choices:
    - multi_scale
    - channel
    - lobe
  - name: training.optimizer
    type: categorical
    choices:
    - adam
    - sgd
    - rmsprop
  - name: training.scheduler
    type: categorical
    choices:
    - reduce_on_plateau
    - cosine
    - none
  - name: training.loss
    type: categorical
    choices:
    - mse
    - combined
    - clinical
  - name: training.learning_rate
    type: float
    low: 1.0e-05
    high: 0.001
    log: true
  - name: training.weight_decay
    type: float
    low: 1.0e-06
    high: 0.001
    log: true
  - name: loss_function.weights.gamma
    type: float
    low: 0.0
    high: 0.5
output:
  results_dir: /data/pgsal/nsclc_doseae/baselines/conv_dose_gpu2
  model_dir: /data/pgsal/nsclc_doseae/baselines/conv_dose_gpu2/models
  log_dir: /data/pgsal/nsclc_doseae/baselines/conv_dose_gpu2/logs
pretrained_encoder:
  use_pretrained_ct_encoder: true
  source: models_genesis
  ct_encoder_path: external/ModelsGenesis/pretrained/Genesis_Chest_CT.pt
  freeze_ct_encoder: false
