dataset:
  dataset_type: patches
  data_h5:
    train: /data/pgsal/NSCLC-Cetuximab_AE_cache/processed_patches/train.h5
    val: /data/pgsal/NSCLC-Cetuximab_AE_cache/processed_patches/val.h5
    test: /data/pgsal/NSCLC-Cetuximab_AE_cache/processed_patches/test.h5
  input_channels:
  - dose
  num_workers: 16
  pin_memory: true
  is_2d: false
  slice_size_2d: 256
  patch_size_3d:
  - 50
  - 50
  - 50
  input_size_3d:
  - 50
  - 50
  - 50
  fusion:
    method: weighted_sum
    dose_weight: 1.0
    normalize: false
  min_dose: 1.0e-06
  use_single_file: false
  data_file: null
  test_mode: false
preprocessing_config: ../new_pipeline_config.yaml
transforms:
  augment: false
model:
  type: resnet_unet_ae
  latent_dim: 128
  base_filters: 64
  feature_dim: 256
  output_channels: 1
  input_mode: dose_only
  input_size:
  - 50
  - 50
  - 50
  use_bottleneck: false
  bilinear_upsampling: false
  dropout_mlp: 0.1
  dropout_decoder: 0.1
  dropout_features: 0.1
  projection_sizes:
  - 256
  - 128
  - 64
  - 32
  - 16
  - 8
  - 4
  attention:
    enabled: false
training:
  optimizer: adam
  scheduler: reduce_on_plateau
  scheduler_patience: 2
  loss: mse
  batch_size: 16
  learning_rate: 0.0001
  epochs: 100
  early_stopping_patience: 10
  weight_decay: 0.00001
  beta: 1.0
  gpu_ids:
  - 0
  seed: 46
  grad_clip: 0.05
  non_zero_loss: false
  accumulation_steps: 1
  numexpr_max_threads: 32
  use_amp: false
  log_frequency: 10
  log_grad_norm: true
clinical_metrics: null
loss_function:
  type: mse
wandb:
  use_wandb: true
  project_name: dose_distribution_autoencoder_05mm
  entity: pgsalome
  name: resnet_unet_patch_dose_only
  run_name: patch_resnet_unet_dose_only
  tags:
  - resnet_unet
  - patches
  - channels=dose
  group: resnet_unet_patch_channels
  log_validation_sample: true
output:
  results_dir: /data/pgsal/nsclc_doseae/experiments/resnet_unet_patch_dose
  model_dir: /data/pgsal/nsclc_doseae/experiments/resnet_unet_patch_dose/models
  log_dir: /data/pgsal/nsclc_doseae/experiments/resnet_unet_patch_dose/logs
pretrained_encoder:
  use_pretrained_ct_encoder: true
  source: medicalnet
  model_depth: 18
  ct_encoder_path: external/MedicalNet/pretrain/resnet_18_23dataset.pth
  freeze_ct_encoder: false
