dataset:
  dataset_type: 'patches'  # <-- ADD THIS: Can be 'patches' or 'images' in the future
  data_h5:
    train: '/data/pgsal/NSCLC-Cetuximab_results_05mm/processed_patches/train.h5'
    val: '/data/pgsal/NSCLC-Cetuximab_results_05mm/processed_patches/val.h5'
    test: '/data/pgsal/NSCLC-Cetuximab_results_05mm/processed_patches/test.h5'
  input_channels: ['dose']  # Options include 'dose', 'ct', 'fused' (order sets channel layout)
  is_2d: false  # Set true to train slice-based 2D models
  slice_size_2d: 256  # Side length for 2D slices
  patch_size_3d: [64, 64, 64]  # 3D patch dimensions (optional override)
  fusion:
    method: 'weighted_sum'  # 'weighted_sum', 'mean', 'max', 'min', 'dose', 'ct'
    dose_weight: 0.7        # Only used for weighted_sum
    ct_weight: 0.3          # Only used for weighted_sum
    normalize: false        # true/'minmax'/'zscore' to normalize fused channel
  use_single_file: false  # Set to true to train on a single .npy file
  data_file: null  # Path to single .npy file if use_single_file is true
  test_mode: false  # Can be set at top level or here for backward compatibility
  n_test_samples: 20  # Can be set at top level or here for backward compatibility

preprocessing_config: 'config/new_pipeline_config.yaml'

# Settings for transforms during training (conceptually separate but not used by preprocessing script)
transforms:
  augment: true  # Whether to apply data augmentation during training
  rotate: true  # Random rotation
  flip: true  # Random flipping
  adjust_brightness: true  # Random brightness adjustment
  random_crop: false  # Random cropping during training
  random_noise: false  # Add random noise during training

model:
  type: 'resnet_ae'  # Options include: resnet_ae, unet_ae, conv_autoencoder, mlp_autoencoder, doseae_resunet
  latent_dim: 128
  base_filters: 32
  feature_dim: 256
  output_channels: 1
  use_bottleneck: false
  bilinear_upsampling: false
  dropout_mlp: 0.1
  dropout_decoder: 0.1
  dropout_features: 0.1
  projection_sizes: [256, 128, 64, 32, 16, 8, 4]  # DoseAE ResUNet projection heads
  attention:
    enabled: false        # Set true to enable spatial attention
    type: 'multi_scale'   # Options: multi_scale, high_dose, spatial, channel, lobe
    num_heads: 4
    embed_dim: 256
    dose_threshold: 0.5   # Only used for high_dose
  auxiliary:
    predict_high_dose: false
    high_dose_label_key: 'high_dose_labels'
    predict_dose_level: false
    dose_level_label_key: 'dose_level_labels'
    dropout: 0.3

hyperparameters:
  learning_rate: 0.0001
  batch_size: 8
  epochs: 100
  early_stopping_patience: 10
  weight_decay: 0.0001
  beta: 1.0  # KL divergence weight for VAE

training:
  optimizer: 'adam'  # Options: 'adam', 'sgd', 'rmsprop'
  scheduler: 'reduce_on_plateau'  # Options: 'reduce_on_plateau', 'cosine_annealing', 'none'
  loss: 'mse'  # Options: 'mse', 'bce', 'combined'
  gpu_id: 0
  seed: 42
  grad_clip: 0.1  # Gradient clipping threshold
  non_zero_loss: false  # Whether to calculate loss only on non-zero regions
  accumulation_steps: 1  # Gradient accumulation steps

# Clinical metrics settings
clinical_metrics:
  use_pymedphys_gamma: true  # true to use PyMedPhys, false to use custom implementation
  gamma_dose_threshold: 3.0  # Dose difference criterion (%)
  gamma_distance_threshold: 3.0  # Distance-to-agreement (mm)
  dose_threshold_cutoff: 10  # Lower dose cutoff (% of max dose)
  calculate_dvh: true
  dvh_num_bins: 1000
  spacing: [0.5, 0.5, 0.5]  # UPDATED: Voxel spacing in mm to match preprocessing

# Loss function configuration
loss_function:
  type: "combined"  # Options: "mse", "gamma", "dvh", "combined", "clinical"
  weights:
    mse: 1.0
    gamma: 0.1  # Weight for gamma pass rate loss (1 - pass_rate)
    dvh: 0.1    # Weight for DVH difference loss
    d95: 0.05   # Weight for D95 difference
    d50: 0.05   # Weight for D50 difference
    d2: 0.05    # Weight for D2 difference
  gamma_calculation_frequency: 10  # Calculate gamma every N batches (expensive operation)

wandb:
  use_wandb: true
  project_name: 'dose_distribution_autoencoder_05mm'  # UPDATED: Project name to reflect resolution
  entity: 'pgsalome'
  name: 'doseae_05mm_nearest'  # UPDATED: Run name to reflect changes

optuna:
  use_optuna: false
  n_trials: 50
  timeout: 86400  # 24 hours
  direction: 'minimize'  # 'minimize' or 'maximize'
  sampler: 'tpe'  # Options: 'tpe', 'random', 'grid'
  pruner: 'median'  # Options: 'median', 'none'
  parameters:
    - name: model.latent_dim
      type: int
      low: 32
      high: 256
      log: true
    - name: model.base_filters
      type: int
      low: 16
      high: 64
      log: true
    - name: model.attention.type
      type: categorical
      choices: ['multi_scale', 'channel', 'lobe']
    - name: training.optimizer
      type: categorical
      choices: ['adam', 'sgd', 'rmsprop']
    - name: training.scheduler
      type: categorical
      choices: ['reduce_on_plateau', 'cosine', 'none']
    - name: training.loss
      type: categorical
      choices: ['mse', 'combined', 'clinical']
    - name: hyperparameters.learning_rate
      type: float
      low: 1.0e-5
      high: 1.0e-3
      log: true
    - name: hyperparameters.weight_decay
      type: float
      low: 1.0e-6
      high: 1.0e-3
      log: true
    - name: loss_function.weights.gamma
      type: float
      low: 0.0
      high: 0.5

output:
  model_dir: '/data/pgsal/nsclc_doseae'
  log_dir: '/data/pgsal/nsclc_doseae/logs'  # UPDATED: Directory name
  results_dir: '/data/pgsal/nsclc_doseae'    # UPDATED: Directory name

# NEW: Settings for compatibility with pre-trained encoders
pretrained_encoder:
  use_pretrained_ct_encoder: false  # Set to true when using pre-trained CT encoder
  ct_encoder_path: null             # Path to pre-trained CT encoder weights
  freeze_ct_encoder: true           # Whether to freeze CT encoder during training
  expected_input_spacing: [0.5, 0.5, 0.5]  # Expected input spacing for pre-trained encoder
